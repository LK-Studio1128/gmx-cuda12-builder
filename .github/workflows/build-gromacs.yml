name: Build GROMACS 2026.3 CUDA12.8 (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 12.8 toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Download GROMACS 2026.3 source
        shell: pwsh
        run: |
          curl.exe -L -o gromacs.tar.gz https://ftp.gromacs.org/gromacs/gromacs-2026.3.tar.gz
          tar -xzf gromacs.tar.gz
          echo "SRC=$((Get-Location).Path)\gromacs-2026.3" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: CMake Configure (Ninja + vcvars)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          if errorlevel 1 ( echo VCVARS-CL-MISSING & exit /b 1 )
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cd /d "%GITHUB_WORKSPACE%"
          cmake -S gromacs-2026.3 -B build -G Ninja ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DGMX_GPU=CUDA ^
            -DGMX_BUILD_OWN_FFTW=ON ^
            -DGMX_MPI=OFF ^
            -DGMX_OPENMP=OFF ^
            -DGMX_DOUBLE=OFF ^
            -DGMX_HWLOC=OFF ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCUDAToolkit_ROOT="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" ^
            -DGMX_CUDA_TARGET_SM="75;80;86;89;90;100;120" ^
            -DCMAKE_INSTALL_PREFIX="C:\gmxout"
          if errorlevel 1 exit /b 1
          if not exist "build\build.ninja" ( echo CONFIG-FAIL & exit /b 1 )

      - name: Build (Release, Ninja)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cd /d "%GITHUB_WORKSPACE%"
          cmake --build build --config Release --parallel 4
          if errorlevel 1 exit /b 1
          if not exist "build\bin\gmx.exe" ( echo BUILD-FAIL & exit /b 1 )

      - name: Install & verify
        shell: pwsh
        run: |
          cmake --install build --config Release
          $gmx = "C:\gmxout\bin\gmx.exe"
          if (-not (Test-Path $gmx)) { Write-Error "install failed"; exit 1 }
          & $gmx --version | Select-String "GROMACS version|GPU support|CUDA compiler"
          # 打包：bin 目录补 cuFFT 运行库
          Copy-Item "build\bin\cufft*.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\*.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gromacs-2026.3-cuda12.8-win64
          path: C:\gmxout\**
          retention-days: 14
