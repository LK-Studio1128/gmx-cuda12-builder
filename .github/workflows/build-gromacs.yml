name: Build GROMACS 2026.3 CUDA12.9 (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 12.9 toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.9.0'

      - name: Download GROMACS 2026.3 source
        shell: pwsh
        run: |
          curl.exe -L -o gromacs.tar.gz https://ftp.gromacs.org/gromacs/gromacs-2026.3.tar.gz
          tar -xzf gromacs.tar.gz
          echo "SRC=$((Get-Location).Path)\gromacs-2026.3" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: CMake Configure
        shell: pwsh
        run: |
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          cmake $env:SRC -G "Visual Studio 17 2022" -A x64 `
            -DGMX_GPU=CUDA `
            -DGMX_BUILD_OWN_FFTW=ON `
            -DGMX_MPI=OFF `
            -DGMX_DOUBLE=OFF `
            -DGMX_HWLOC=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCUDAToolkit_ROOT=$cuda `
            -DGMX_CUDA_TARGET_SM="75;80;86;89;90;100;120" `
            -DCMAKE_INSTALL_PREFIX="C:\gmxout"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path ".\gromacs.sln")) { Write-Error "configure failed: no sln"; exit 1 }

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build . --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path ".\bin\Release\gmx.exe")) { Write-Error "build failed: no gmx.exe"; exit 1 }

      - name: Install & verify
        shell: pwsh
        run: |
          cmake --install . --config Release
          $gmx = "C:\gmxout\bin\gmx.exe"
          if (-not (Test-Path $gmx)) { Write-Error "install failed"; exit 1 }
          & $gmx --version | Select-String "GROMACS version|GPU support|CUDA compiler"
          # 打包：bin 目录补 cuFFT 运行库
          Copy-Item ".\bin\Release\cufft*.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue
          Copy-Item ".\bin\Release\*.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gromacs-2026.3-cuda12.9-win64
          path: C:\gmxout\**
          retention-days: 14
