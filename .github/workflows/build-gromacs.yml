name: Build GROMACS 2026.3 CUDA12.8 all-arch (Windows)

on:
  push:
    branches: [main]
    # 仅当构建逻辑本身变化时才运行（文档/README/LICENSE 变更不触发，
    # 避免浪费 Windows runner 分钟）。需要手动构建时用 workflow_dispatch。
    paths:
      - '.github/workflows/build-gromacs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 12.8 toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Download GROMACS 2026.3 source
        shell: pwsh
        run: |
          curl.exe -L -o gromacs.tar.gz https://ftp.gromacs.org/gromacs/gromacs-2026.3.tar.gz
          tar -xzf gromacs.tar.gz

      - name: Patch OpenMP find_package (CMake 3.31 OpenMP_CUDA bug workaround)
        shell: pwsh
        run: |
          # LKDock drives mdrun threading as a single MPI rank with -ntomp >1 OpenMP threads,
          # so GROMACS MUST be compiled with OpenMP (GMX_OPENMP=ON). With the CUDA language
          # enabled, CMake >= 3.31 additionally probes OpenMP_CUDA during find_package(OpenMP)
          # and fails (missing LIB_NAMES). Restricting every OpenMP find_package to
          # COMPONENTS C CXX avoids the CUDA probe while keeping host OpenMP.
          $patched = 0
          Get-ChildItem -Path gromacs-2026.3 -Recurse -Filter CMakeLists.txt | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $c2 = $c.Replace('find_package(OpenMP REQUIRED)', 'find_package(OpenMP REQUIRED COMPONENTS C CXX)')
            $c2 = $c2.Replace('find_package(OpenMP)', 'find_package(OpenMP COMPONENTS C CXX)')
            if ($c2 -ne $c) { Set-Content $_.FullName $c2 -NoNewline; $patched++; Write-Output ("patched: " + $_.FullName) }
          }
          Write-Output ("patched files: " + $patched)

      - name: Install FFTW3F via vcpkg
        shell: cmd
        run: |
          where vcpkg
          if errorlevel 1 ( git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics )
          vcpkg install fftw3:x64-windows
          if errorlevel 1 exit /b 1
          dir C:\vcpkg\installed\x64-windows\lib\*fftw3*.lib /b 2>nul
          dir C:\vcpkg\installed\x64-windows\include\fftw3.h 2>nul

      - name: Cache GROMACS build (fast re-run)
        uses: actions/cache@v4
        with:
          path: |
            build
          # 不挂 restore-keys：架构清单变化必须全量重编，恢复旧对象反而掩盖错误
          key: gmx-2026.3-cuda128-omp-${{ runner.os }}-v4-allarch

      - name: CMake Configure (Ninja + vcvars + MSVC cl)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          if errorlevel 1 ( echo VCVARS-CL-MISSING & exit /b 1 )
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cd /d "%GITHUB_WORKSPACE%"
          cmake -S gromacs-2026.3 -B build -G Ninja ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DGMX_GPU=CUDA ^
            -DGMX_FFT_LIBRARY=fftw3 ^
            -DCMAKE_PREFIX_PATH="C:\vcpkg\installed\x64-windows" ^
            -DGMX_MPI=OFF ^
            -DGMX_OPENMP=ON ^
            -DGMX_DOUBLE=OFF ^
            -DGMX_HWLOC=OFF ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCUDAToolkit_ROOT="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" ^
            -DCMAKE_CUDA_ARCHITECTURES="50;52;61;70;75;80;86;89;90;100;120;120-virtual" ^
            -DCMAKE_INSTALL_PREFIX="C:\gmxout"
          if errorlevel 1 exit /b 1
          if not exist "build\build.ninja" ( echo CONFIG-FAIL & exit /b 1 )

      - name: Build (Release, Ninja)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cd /d "%GITHUB_WORKSPACE%"
          cmake --build build --config Release --parallel 4
          if errorlevel 1 exit /b 1
          if not exist "build\bin\gmx.exe" ( echo BUILD-FAIL & exit /b 1 )

      - name: Install & package (runtime dlls + verify)
        shell: pwsh
        run: |
          cmake --install build --config Release
          $gmx = "C:\gmxout\bin\gmx.exe"
          if (-not (Test-Path $gmx)) { Write-Error "install failed"; exit 1 }
          # 补运行时：FFTW + CUDA runtime(cuFFT/cudart) —— 产物需自带才能跑
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\*fftw*.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\*.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          $cudaBin = "$cudaRoot\bin"
          Write-Output "=== CUDA bin cuda/cufft dll ==="
          Get-ChildItem "$cudaBin\cuda*.dll","$cudaBin\cufft*.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Copy-Item "$cudaBin\cudart64_12.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$cudaBin\cublas64_12.dll" "C:\gmxout\bin\" -ErrorAction SilentlyContinue
          # cuFFT：bin 缺失则递归全 CUDA 目录定位（诊断 + 拷入）
          $cufft = Get-ChildItem "$cudaRoot" -Recurse -Filter "cufft64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cufft) {
            Copy-Item $cufft.FullName "C:\gmxout\bin\"
            Write-Output "cufft OK from: $($cufft.FullName)"
          } else {
            Write-Output "WARN: NO cufft64 dll under $cudaRoot"
          }
          # verify（容错：失败只记录不中断，产物照常上传）
          try {
            & "C:\gmxout\bin\gmx.exe" --version 2>&1 | Out-File C:\gmx_version.txt
            Get-Content C:\gmx_version.txt | Select-Object -First 4
            # CRITICAL: LKDock threads via -ntomp >1 on a single MPI rank -> OpenMP build required.
            if (Select-String -Path C:\gmx_version.txt -Pattern "OpenMP support:\s+enabled" -Quiet) {
              Write-Output "OpenMP check: enabled (OK)"
            } else {
              Write-Error "OpenMP support DISABLED in this build - LKDock -ntomp threading would fail. Aborting."
              exit 1
            }
          } catch { Write-Output ("verify warn: " + $_.Exception.Message) }
          Get-ChildItem "C:\gmxout\bin" -Name | Select-Object -First 12

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gromacs-2026.3-cuda12.8-win64
          path: C:\gmxout\**
          retention-days: 14

